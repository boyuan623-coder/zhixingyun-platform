# 智行云 API 网关
server.port=8000

spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379

# 令牌桶：容量20，每秒补充5（便于压测打出 429；生产可调大）
train.gateway.rate-limit.enabled=true
train.gateway.rate-limit.capacity=20
train.gateway.rate-limit.rate=5

spring.cloud.gateway.routes[0].id=member
spring.cloud.gateway.routes[0].uri=http://127.0.0.1:8001
spring.cloud.gateway.routes[0].predicates[0]=Path=/member/**

spring.cloud.gateway.routes[1].id=business
spring.cloud.gateway.routes[1].uri=http://127.0.0.1:8002
spring.cloud.gateway.routes[1].predicates[0]=Path=/business/**

spring.cloud.gateway.routes[2].id=batch
spring.cloud.gateway.routes[2].uri=http://127.0.0.1:8003
spring.cloud.gateway.routes[2].predicates[0]=Path=/batch/**

spring.cloud.gateway.routes[3].id=payment
spring.cloud.gateway.routes[3].uri=http://127.0.0.1:8004
spring.cloud.gateway.routes[3].predicates[0]=Path=/payment/**

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600
