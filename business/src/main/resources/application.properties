# 智行云 business 服务
server.port=8002
server.servlet.context-path=/business
spring.application.name=business

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/train_business?characterEncoding=UTF8&autoReconnect=true&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.mapper-locations=classpath:/mapper/**/*.xml
logging.level.com.jiawa.train.business.mapper=info

# Redis
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.timeout=3000ms

# RabbitMQ
spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.port=5672
spring.rabbitmq.username=train
spring.rabbitmq.password=train123
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.prefetch=10

# 购票：true=MQ异步；压测超卖请用 /do-sync 或设为 false
train.confirm.async=true
train.order.timeout-minutes=15

# Seata（超时调大，避免回滚异常）
seata.enabled=true
seata.application-id=business
seata.tx-service-group=train_tx_group
seata.service.vgroup-mapping.train_tx_group=default
seata.service.grouplist.default=127.0.0.1:8091
seata.registry.type=file
seata.config.type=file
seata.client.rm.report-success-enable=true
