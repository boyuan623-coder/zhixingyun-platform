# 智行云中间件：Redis / RabbitMQ / Seata Server
# 用法：在 docker 目录执行 docker compose up -d
# 本机若已有 Redis(6379)/MySQL(3306)，可只启动 rabbitmq + seata-server
services:
  redis:
    image: redis:7.2
    container_name: train-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - train-redis-data:/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: train-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: train
      RABBITMQ_DEFAULT_PASS: train123

  seata-server:
    image: seataio/seata-server:1.7.1
    container_name: train-seata
    ports:
      - "8091:8091"
      - "7091:7091"
    environment:
      SEATA_PORT: 8091
      STORE_MODE: file
      SEATA_CONFIG_NAME: file:/root/seata-config/registry
    volumes:
      - ./seata/registry.conf:/root/seata-config/registry.conf

volumes:
  train-redis-data:
