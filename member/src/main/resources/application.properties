# 智行云 member 服务（作者：tuboyuan）
# 本地开发请复制 application-local.properties.example 为 application-local.properties，并启用 spring.profiles.active=local
spring.profiles.active=local
server.port=8001
server.servlet.context-path=/member

spring.application.name=member

# 数据库连接
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/train_member?characterEncoding=UTF8&autoReconnect=true&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# mybatis xml路径
mybatis.mapper-locations=classpath:/mapper/**/*.xml
logging.level.com.jiawa.train.member.mapper=trace
