# 智行云 payment 服务
server.port=8004
server.servlet.context-path=/payment

spring.application.name=payment

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/train_payment?characterEncoding=UTF8&autoReconnect=true&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath:/mapper/**/*.xml
logging.level.com.jiawa.train.payment.mapper=trace

seata.enabled=true
seata.application-id=payment
seata.tx-service-group=train_tx_group
seata.service.vgroup-mapping.train_tx_group=default
seata.registry.type=file
seata.config.type=file
seata.service.grouplist.default=127.0.0.1:8091
